<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= BACKGROUND ================= -->

<div class="stars"></div>

<canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

<div class="nebula"></div>

<div class="shooting-star shooting-star1"></div>
<div class="shooting-star shooting-star2"></div>
<div class="shooting-star shooting-star3"></div>

<!-- ================= SOLAR SYSTEM ================= -->

<div class="solar-system">

    <!-- Sun -->

    <div class="sun" data-name="Sun" data-info="Our star, holding 99.8% of the system's mass."></div>

    <!-- Mercury -->

    <div class="orbit mercury-orbit">
        <div class="planet mercury" data-name="Mercury" data-info="Smallest planet, a year lasts just 88 days."></div>
    </div>

    <!-- Venus -->

    <div class="orbit venus-orbit">
        <div class="planet venus" data-name="Venus" data-info="Hottest planet, spinning backwards."></div>
    </div>

    <!-- Earth -->

    <div class="orbit earth-orbit">

        <div class="planet earth" data-name="Earth" data-info="Our home, the only planet known to host life.">

            <div class="moon-orbit">
                <div class="moon"></div>
            </div>

        </div>

    </div>

    <!-- Mars -->

    <div class="orbit mars-orbit">
        <div class="planet mars" data-name="Mars" data-info="The Red Planet, home of the tallest volcano."></div>
    </div>

    <!-- Asteroid Belt -->

    <div class="asteroid-belt"></div>

    <!-- Jupiter -->

    <div class="orbit jupiter-orbit">
        <div class="planet jupiter" data-name="Jupiter" data-info="Largest planet, with the Great Red Spot storm."></div>
    </div>

    <!-- Saturn -->

    <div class="orbit saturn-orbit">
        <div class="planet saturn" data-name="Saturn" data-info="Ringed jewel with the most moons."></div>
    </div>

    <!-- Uranus -->

    <div class="orbit uranus-orbit">
        <div class="planet uranus" data-name="Uranus" data-info="Ice giant that rolls on its side."></div>
    </div>

    <!-- Neptune -->

    <div class="orbit neptune-orbit">
        <div class="planet neptune" data-name="Neptune" data-info="Windiest planet, with supersonic blue storms."></div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
